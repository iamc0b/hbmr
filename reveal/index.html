<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Corstorphine AAC team reveal for the Hodgson Brothers Mountain Relay">
<meta property="og:title" content="Corstorphine AAC · HBMR team reveal">
<meta property="og:description" content="Answer the questions, find the checkpoint, meet the pairs.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Hodgson Relay Team Reveal</title>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column on an OS-style 1km grid; each leg is a "control card" you punch through */
:root{
  --paper:#f3f6f2; --ink:#1d2a24; --muted:#5d6b63; --line:#c9d6cd;
  --grid:rgba(40,110,150,.13); --contour:rgba(150,95,40,.10);
  --control:#e8621c; --control-ink:#fff; --card:#ffffff; --ok:#2f7d4f; --bad:#b3362b;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141c18; --ink:#e7eee9; --muted:#9aaba1; --line:#2d3b34;
  --grid:rgba(110,180,220,.12); --contour:rgba(220,160,90,.08);
  --control:#f07a38; --control-ink:#1a0e06; --card:#1c2621; --ok:#5fbf86; --bad:#ef7a6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141c18; --ink:#e7eee9; --muted:#9aaba1; --line:#2d3b34;
  --grid:rgba(110,180,220,.12); --contour:rgba(220,160,90,.08);
  --control:#f07a38; --control-ink:#1a0e06; --card:#1c2621; --ok:#5fbf86; --bad:#ef7a6e; color-scheme:dark}

html,body{min-height:100%}
body{
  background:var(--paper); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.5;
  background-image:
    repeating-radial-gradient(circle at 78% 18%, transparent 0 22px, var(--contour) 22px 24px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:auto, 64px 64px, 64px 64px;
  background-attachment:fixed;
}
.wrap{max-width:520px; margin:0 auto; padding-inline:16px; padding-block:24px 48px; display:flex; flex-direction:column; gap:20px}
.eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
h1,h2{font-family:var(--display); font-weight:800; line-height:1; margin:0; text-wrap:balance; text-transform:uppercase; letter-spacing:.01em}
h1{font-size:clamp(40px,12vw,56px)}
h2{font-size:32px}
p{margin:0}
.lede{color:var(--muted); max-width:60ch}

/* control flag: the orange/white orienteering marker */
.logos{display:flex;align-items:center;gap:12px}
.logo{height:52px;max-width:45%;display:grid;place-items:center}
.logo img{height:52px;width:auto;max-width:100%;object-fit:contain}
.logo.ph{width:52px;border:1.5px solid var(--ink);font-family:var(--display);font-weight:800;font-size:13px;line-height:1;text-align:center;padding:4px;box-sizing:border-box;background:var(--card)}
.logo-x{font-family:var(--display);font-weight:600;color:var(--muted);font-size:20px}
.head{display:flex;flex-direction:column;gap:6px}
.wait{aspect-ratio:3/4;max-width:100%;border:1.5px dashed var(--line);display:grid;place-items:center;align-content:center;gap:4px;color:var(--muted);background:var(--paper)}
.wait .count{font-family:var(--mono);font-weight:600;font-size:44px;color:var(--control);font-variant-numeric:tabular-nums}
.wait .msg{font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.runner.in .photo{animation:pop .9s cubic-bezier(.2,.8,.2,1.2) both}
.runner.in .rname,.runner.in .rclub{animation:rise .6s .5s both}
@keyframes pop{0%{transform:scale(.6) rotate(-4deg);opacity:0;filter:blur(8px)}100%{transform:none;opacity:1;filter:none}}

.legs{display:grid;gap:10px}
.leg-btn{all:unset; box-sizing:border-box; display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--card); border:1.5px solid var(--line); cursor:pointer}
.leg-btn:focus-visible{outline:3px solid var(--control); outline-offset:2px}
.leg-btn .num{font-family:var(--display); font-weight:800; font-size:34px; width:40px; color:var(--control)}
.leg-btn .t{font-family:var(--display); font-weight:600; font-size:22px; text-transform:uppercase; line-height:1.1}
.leg-btn .s{font-size:14px; color:var(--muted)}
.leg-btn .chip{margin-left:auto; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:4px 8px; border:1.5px solid currentColor; white-space:nowrap}
.leg-btn[aria-disabled="true"]{cursor:default; opacity:.55}
.chip.done{color:var(--ok)} .chip.open{color:var(--control)} .chip.locked{color:var(--muted)}

.card{background:var(--card); border:1.5px solid var(--ink); padding:20px 18px; display:flex; flex-direction:column; gap:16px}
.progress{display:flex; gap:6px}
.progress span{flex:1; height:6px; background:var(--line)}
.progress span.on{background:var(--control)}
.q{font-size:20px; font-weight:600; line-height:1.35}
.opts{display:grid; gap:8px}
.opt{all:unset; box-sizing:border-box; padding:13px 14px; border:1.5px solid var(--line); background:var(--paper); cursor:pointer; font-size:17px}
.opt:focus-visible{outline:3px solid var(--control); outline-offset:2px}
.opt.wrong{border-color:var(--bad); color:var(--bad); animation:shake .35s}
.opt.right{border-color:var(--ok); color:var(--ok); font-weight:600}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{font-size:15px; min-height:1.5em}
.fb.bad{color:var(--bad)} .fb.good{color:var(--ok)}

/* grid ref pieces */
.pieces{display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-family:var(--mono); font-weight:600; font-size:22px; font-variant-numeric:tabular-nums}
.piece{border:1.5px dashed var(--line); padding:4px 10px; min-width:3.2ch; text-align:center; color:var(--muted)}
.piece.got{border-style:solid; border-color:var(--control); color:var(--ink)}
.piece-lbl{display:block; font-size:10px; letter-spacing:.06em; color:var(--muted); font-weight:500}

.btn{all:unset; box-sizing:border-box; text-align:center; padding:14px 18px; background:var(--control); color:var(--control-ink); font-family:var(--display); font-weight:800; font-size:22px; text-transform:uppercase; letter-spacing:.03em; cursor:pointer}
:root .btn{color:#fff}
.btn:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line); font-size:18px}
input.grid{font-family:var(--mono); font-size:26px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:12px 14px; border:1.5px solid var(--ink); background:var(--paper); color:var(--ink); width:100%; box-sizing:border-box}
input.grid:focus-visible{outline:3px solid var(--control); outline-offset:1px}

/* reveal */
.reveal{text-align:left}
.cp{font-family:var(--mono); font-size:14px; color:var(--muted)}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.runner{display:flex; flex-direction:column; gap:8px}
.photo{aspect-ratio:3/4; max-width:100%; background:var(--paper); border:1.5px solid var(--ink); display:grid; place-items:center; font-family:var(--display); font-weight:800; font-size:48px; color:var(--control); overflow:hidden}
.photo img{width:100%; height:100%; object-fit:cover; object-position:50% 30%}
.rname{font-family:var(--display); font-weight:800; font-size:26px; text-transform:uppercase; line-height:1}
.rclub{font-size:14px; color:var(--muted)}
@keyframes rise{from{opacity:.0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.photo-wrap{position:relative}
.debut-tag{position:absolute;top:-10px;right:-6px;z-index:2;background:var(--control);color:#fff;font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;transform:rotate(4deg);box-shadow:0 2px 0 var(--ink)}
.runner.debut .photo{box-shadow:0 0 0 3px var(--control),0 0 24px 4px rgba(255,190,60,.55);animation:glow 2.4s ease-in-out infinite alternate}
.runner.in.debut .photo{animation:pop .9s cubic-bezier(.2,.8,.2,1.2) both,glow 2.4s 1s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 3px var(--control),0 0 34px 10px rgba(255,210,90,.75)}}
.spark{position:absolute;pointer-events:none;z-index:3;width:var(--s);height:var(--s);left:var(--x);top:var(--y);
  background:radial-gradient(circle,#fff 0 18%,#ffd45a 30%,transparent 62%);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
  animation:twinkle var(--d) var(--dl) ease-in-out infinite}
.spark.burst{animation:burst 1.1s var(--dl) ease-out both}
@keyframes twinkle{0%,100%{transform:scale(0) rotate(0);opacity:0}50%{transform:scale(1) rotate(90deg);opacity:1}}
@keyframes burst{0%{transform:translate(0,0) scale(.2);opacity:1}100%{transform:translate(var(--bx),var(--by)) scale(1) rotate(180deg);opacity:0}}
.predict{display:flex;flex-direction:column;gap:14px}
.tin{display:flex;gap:8px;align-items:flex-end}
.tin label{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.tin input{font-family:var(--mono);font-size:26px;font-weight:600;padding:10px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box;text-align:center;font-variant-numeric:tabular-nums}
.tin input:focus-visible{outline:3px solid var(--control);outline-offset:1px}
.tin .colon{font-family:var(--mono);font-size:26px;font-weight:600;padding-bottom:12px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs div{border:1.5px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.vs .big{font-family:var(--mono);font-weight:600;font-size:26px;font-variant-numeric:tabular-nums}
.vs .cap{border-color:var(--control)}
.diff{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1.1}
.diff small{display:block;font-family:var(--body);font-weight:400;font-size:15px;text-transform:none;color:var(--muted);margin-top:4px}
.tally{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.tally th,.tally td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.tally td:not(:first-child),.tally th:not(:first-child){text-align:right;font-family:var(--mono)}
.tally tfoot td{font-weight:600;border-bottom:none;border-top:1.5px solid var(--ink)}
.finale{border-color:var(--control);border-width:2px}
.minor{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.minor .link{font-size:13px}
.sharecard{gap:0;padding:16px 14px;border-width:2px}
.shead{display:flex;flex-direction:column;gap:10px;padding-bottom:12px;border-bottom:1.5px solid var(--ink)}
.shead .logo,.shead .logo img{height:36px}.shead .logo.ph{width:36px;font-size:10px}
.sname{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1}
.sharecard img{width:100%;display:block;border:1px solid var(--line)}
.sharecard img.pulse{animation:pulse 1.2s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.8)}100%{box-shadow:0 0 0 18px rgba(37,211,102,0)}}
.btn.wa{background:#25d366;color:#0b3d1f!important;display:flex;align-items:center;justify-content:center;gap:10px}
.statscard{display:flex;flex-direction:column;gap:6px;padding:20px 18px;background:var(--ink);color:var(--paper);text-decoration:none;border:2px solid var(--ink);
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:32px 32px}
.statscard .eyebrow{color:var(--control)}
.statscard .st-title{font-family:var(--display);font-weight:800;font-size:34px;text-transform:uppercase;line-height:1}
.statscard .st-sub{font-size:15px;opacity:.8}
.statscard .st-go{margin-top:8px;align-self:flex-start;background:var(--control);color:#fff;font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;padding:10px 16px}
.statscard:focus-visible{outline:3px solid var(--control);outline-offset:2px}
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.heads{display:flex;flex:none}
.heads img,.heads .ini{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--card);background:var(--paper);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;color:var(--control);box-sizing:border-box}
.heads > :nth-child(2){margin-left:-12px}
.sinfo{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.sinfo b{font-weight:600;font-size:15px}
.sinfo span,.stime span{font-size:12px;color:var(--muted)}
.stime{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--mono);font-variant-numeric:tabular-nums}
.stime b{font-size:17px;font-weight:600}
.srow.stot{border-bottom:none;border-top:1.5px solid var(--ink);margin-top:-1px}
.srow.stot .stime b{color:var(--control);font-size:20px}
a.btn{display:block}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.foot{font-size:13px; color:var(--muted)}
.confirm{display:flex;flex-direction:column;gap:10px;padding:14px;border:1.5px solid var(--bad);background:var(--card)}
.confirm-btns{display:flex;gap:8px}.confirm-btns .btn{flex:1;font-size:18px;padding:10px}
.link{all:unset; cursor:pointer; color:var(--muted); font-size:15px; text-decoration:underline}
</style>

<div class="wrap" id="app"></div>

<script>
/* =========================================================
   EDIT THIS SECTION — everything the quiz shows lives here
   ========================================================= */
const CONFIG = {
  teamName: "Corstorphine AAC",
  raceDate: "Sat 3 October 2026",
  // Which legs people can open right now. Add the next number and republish to unveil it.
  released: [1, 2, 3, 4],
  // Logo images (filled in once you send them). Leave "" to show the text placeholder.
  logos: { race: "", club: "" },
  secondRunnerDelay: 20,
  captainPosition: 10,
  statsUrl: "https://iamc0b.github.io/hbmr/",   // club HBMR stats page
  raceYear: 2026,
  quizUrl: "https://claude.ai/artifact/ApyPUKeueSxRAL5u1BcNym",     // Captain COB's predicted finishing position   // seconds between runner 1 and runner 2 appearing
  legs: [
    {
      leg: 1,
      captain: "0:44:44",            // Captain COB's predicted time (h:mm:ss)
      route: "Patterdale to Hartsop", dist: "6.7 km · 440 m",
      grid: "NY 417 145",           // revealed piece by piece
      checkpoint: "Angle Tarn",
      accept: ["angle tarn peninsula", "angletarn"],
      runners: [
        { name: "Tom Ferrington", note: "Leg 1", debut: false, photo: "photos/tom.jpg", head: "photos/tom-head.jpg" },
        { name: "Pawel Pomorski", note: "Hodgson debut", debut: true, photo: "photos/pawel.jpg", head: "photos/pawel-head.jpg" }
      ],
      questions: [
        { q: "In which year was the relay first run?",
          options: ["1981", "1986", "1991", "1996"], answer: 1 },
        { q: "What was the race originally called?",
          options: ["The Patterdale Fell Relay", "The Kirkstone Relay", "The Ian Hodgson Mountain Relay", "The Lakeland Pairs Relay"], answer: 2 },
        { q: "Ian Hodgson won the Score Class of which event in 1985, the day before his accident?",
          options: ["Fell Runners Association Relays", "Karrimor International Mountain Marathon", "Bob Graham Round", "Saunders Lakeland Mountain Marathon"], answer: 1 }
      ]
    },
    {
      leg: 2,
      captain: "1:11:11",            // Captain COB's predicted time (h:mm:ss)
      route: "Hartsop to Kirkstone", dist: "11 km · 890 m",
      grid: "NY 441 111",
      checkpoint: "High Street",
      accept: ["high st"],
      runners: [
        { name: "James Dunn", note: "Leg 2", debut: false, photo: "photos/james.jpg", head: "photos/james-head.jpg" },
        { name: "Jack Eykelbosch", note: "Leg 2", debut: false, photo: "photos/jack.jpg", head: "photos/jack-head.jpg" }
      ],
      questions: [
        { q: "Every leg is run in pairs. How many runners make up a team?",
          options: ["4", "6", "8", "10"], answer: 2 },
        { q: "Which club holds the Open team record?",
          options: ["Keswick AC", "Borrowdale", "Ambleside AC", "Dark Peak"], answer: 1 },
        { q: "The race has twice been run backwards. Which years?",
          options: ["1998 and 2007", "1990 and 2001", "2003 and 2012", "1995 and 2015"], answer: 0 }
      ]
    },
    {
      leg: 3,
      captain: "0:51:51",            // Captain COB's predicted time (h:mm:ss)
      route: "Kirkstone to Hartsop Hall", dist: "7.5 km · 570 m",
      grid: "NY 396 087",
      checkpoint: "Red Screes tarn",
      accept: ["red screes", "red screes tarn northeast"],
      runners: [
        { name: "Ewan Brown", note: "Leg 3", debut: false, photo: "photos/ewan.jpg", head: "photos/ewan-head.jpg" },
        { name: "Julian Barrable", note: "Leg 3", debut: false, photo: "photos/julian.jpg", head: "photos/julian-head.jpg" }
      ],
      questions: [
        { q: "Which club set the women's team record in 2024?",
          options: ["Helm Hill Runners", "Ambleside AC", "Keswick AC", "Kendal AC"], answer: 0 },
        { q: "Which club holds the Mixed team record, set in 2003?",
          options: ["Horsforth Fellandale", "Bingley Harriers", "Saltwell Harriers", "Borrowdale"], answer: 1 },
        { q: "Why was there no race in 2020?",
          options: ["Foot and mouth", "Storm damage", "Covid-19 restrictions", "Course closure"], answer: 2 }
      ]
    },
    {
      leg: 4,
      captain: "1:10:10",            // Captain COB's predicted time (h:mm:ss)
      route: "Hartsop Hall to Patterdale", dist: "11 km · 900 m",
      grid: "NY 368 134",
      checkpoint: "St Sunday Crag",
      accept: ["st sunday crag", "saint sunday crag", "sunday crag"],
      runners: [
        { name: "Fearghas Thomson", note: "Leg 4", debut: false, photo: "photos/fearghas.jpg", head: "photos/fearghas-head.jpg" },
        { name: "Sam Alexander", note: "Hodgson debut", debut: true, photo: "photos/sam.jpg", head: "photos/sam-head.jpg" }
      ],
      questions: [
        { q: "In what year did the race first move from Sunday to Saturday?",
          options: ["2019", "2022", "2024", "2025"], answer: 2 },
        { q: "Roughly how many teams are allowed to enter each year?",
          options: ["40", "70", "120", "200"], answer: 1 },
        { q: "For how many years did the Hodgson family organise the event, with help from Horsforth Fellandale?",
          options: ["10", "15", "20", "30"], answer: 2 }
      ]
    }
  ]
};
/* ========================================================= */

const app = document.getElementById("app");
const KEY = "hbmr-reveal-v1";
let progress = {};
try { progress = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { progress = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(progress)); } catch (e) {} };
const norm = s => s.toUpperCase().replace(/[^A-Z0-9]/g, "").replace(/^NY/, "");
const digits = g => norm(g); // 6 digits
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const initials = n => n.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();

function logos() {
  const one = (src, txt, alt) => src ? `<span class="logo"><img src="${src}" alt="${alt}"></span>` : `<span class="logo ph" aria-label="${alt}">${txt}</span>`;
  return `<div class="logos">${one(CONFIG.logos.race, "HBMR", "Hodgson Brothers Mountain Relay")}<span class="logo-x" aria-hidden="true">×</span>${one(CONFIG.logos.club, "CAAC", "Corstorphine AAC")}</div>`;
}
const cleanName = s => s.toLowerCase().replace(/\bthe\b/g, "").replace(/\bst\.?\b/g, "st").replace(/[^a-z]/g, "");
let revealTimer = null;

// Reset: n = leg number, or null for everything. Confirm happens in the page.
function wireReset(box, n) {
  box.querySelector("#reset").onclick = () => {
    box.innerHTML = `<div class="confirm"><span>${n ? "Clear leg " + n + " and start it again?" : "Clear all progress and start again?"}</span>
      <span class="confirm-btns"><button class="btn" id="yes">Reset</button><button class="btn ghost" id="no">Cancel</button></span></div>`;
    box.querySelector("#no").onclick = () => n ? reveal(CONFIG.legs.find(l => l.leg === n), false) : home();
    box.querySelector("#yes").onclick = () => {
      clearInterval(revealTimer);
      if (n) delete progress[n]; else progress = {};
      save();
      if (n) { if (location.hash === "#leg" + n) leg(n); else go(n); } else home();
      window.scrollTo(0, 0);
    };
  };
}

// ---- time predictions ----
const toSec = t => { const p = String(t).split(":").map(Number); return p.reduce((a, v) => a * 60 + v, 0); };
const fmt = sec => { sec = Math.round(Math.abs(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s2 = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s2).padStart(2, "0"); };
const diffWords = (you, cap) => { const d = you - cap;
  if (Math.abs(d) < 1) return "Spot on. Exactly Captain COB's time!";

function go(n) { location.hash = "leg" + n; }

function pieces(leg, got) {
  const d = digits(leg.grid);
  // three questions, three pieces of two digits each
  const p = [d.slice(0,2), d.slice(2,4), d.slice(4,6)];
  const lbl = ["Piece 1", "Piece 2", "Piece 3"];
  return `<div class="pieces" aria-label="Grid reference pieces"><span>NY</span>${p.map((x,i) =>
    `<span class="piece ${i < got ? "got" : ""}">${i < got ? x : "··"}<span class="piece-lbl">${lbl[i]}</span></span>`).join("")}</div>`;
}

function leg(n) {
  const L = CONFIG.legs.find(l => l.leg === n);
  if (!L || !CONFIG.released.includes(n)) return home();
  const st = legState(n);
  if (st.solved) return reveal(L, false);
  if (st.step >= L.questions.length) return gridEntry(L);

  const Q = L.questions[st.step];
  app.innerHTML = `
    <button class="link" id="back">← All legs</button>
    ${logos()}
    <div class="head"><div><div class="eyebrow">Leg ${n} · Question ${st.step + 1} of ${L.questions.length}</div><h2>Who's on leg ${n}?</h2></div></div>
    <div class="card">
      <div class="progress">${L.questions.map((_, i) => `<span class="${i < st.step ? "on" : ""}"></span>`).join("")}</div>
      <p class="q">${esc(Q.q)}</p>
      <div class="opts">${Q.options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
      <p class="fb" id="fb" aria-live="polite"></p>
    </div>
    <div class="card"><div class="eyebrow">Grid reference so far</div>${pieces(L, st.step)}</div>`;
  document.getElementById("back").onclick = home;
  const fb = document.getElementById("fb");
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (i === Q.answer) {
      b.classList.add("right");
      app.querySelectorAll(".opt").forEach(x => x.disabled = true);
      fb.className = "fb good"; fb.textContent = "Correct. You've found the next piece of the grid reference.";
      st.step++; save();
      setTimeout(() => leg(n), 1100);
    } else {
      b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
      fb.className = "fb bad"; fb.textContent = "Not that one. Try again.";
    }
  });
}

function gridEntry(L) {
  app.innerHTML = `
    <button class="link" id="back">← All legs</button>
    ${logos()}
    <div class="head"><div><div class="eyebrow">Leg ${L.leg} · Final control</div><h2>Name the checkpoint</h2></div></div>

      <form id="f" style="display:flex;flex-direction:column;gap:12px">

function sparkles(burst) {

  for (let i = 0; i < 9; i++) {
    const sz = 10 + Math.random() * 16;
    h += `<span class="spark" style="--s:${sz}px;--x:${Math.random()*92}%;--y:${Math.random()*92}%;--d:${1.4+Math.random()*1.6}s;--dl:${Math.random()*2}s"></span>`;
  }
  if (burst) for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2, r = 70 + Math.random() * 50;
    h += `<span class="spark burst" style="--s:${14+Math.random()*12}px;--x:44%;--y:44%;--bx:${Math.cos(a)*r}px;--by:${Math.sin(a)*r}px;--dl:${.3+Math.random()*.3}s"></span>`;
  }
  return h;
}

function runnerHTML(r, animate) {
  return `<div class="runner${animate ? " in" : ""}${r.debut ? " debut" : ""}">
    <div class="photo-wrap">
      ${r.debut ? `<span class="debut-tag">Debut</span>` : ""}
      <div class="photo">${r.photo ? `<img src="${esc(r.photo)}" alt="${esc(r.name)}">` : initials(r.name)}</div>
      ${r.debut ? sparkles(animate) : ""}
    </div>
    <div class="rname">${esc(r.name)}</div>
    <div class="rclub">${esc(r.note)}</div>
  </div>`;
}

function reveal(L, animate) {
  clearInterval(revealTimer);
  const [a, b] = L.runners;
  app.innerHTML = `
    <button class="link" id="back">← All legs</button>
    ${logos()}
    <div class="head"><div><div class="eyebrow">Leg ${L.leg} · Control found</div>
      <p class="cp">${esc(L.grid)} · ${esc(L.checkpoint)}</p>
      <p class="cp">${esc(L.route)} · ${esc(L.dist)}</p></div></div>
    <h1>Leg ${L.leg} pair</h1>
    <div class="pair">${runnerHTML(a, animate)}<div id="slot2">${animate ? "" : runnerHTML(b, false)}</div></div>
    <div id="predict"></div>
    <button class="btn ghost" id="again">Back to all legs</button>
    <div class="minor"><button class="link" id="replay">Replay reveal</button><span aria-hidden="true">·</span><div id="resetbox"><button class="link" id="reset">Play leg ${L.leg} again</button></div></div>`;
  document.getElementById("back").onclick = home;
  document.getElementById("again").onclick = home;
  wireReset(document.getElementById("resetbox"), L.leg);
  document.getElementById("replay").onclick = () => reveal(L, true);
  if (!animate) return mountPredict(L);
  const slot = document.getElementById("slot2");
  let t = CONFIG.secondRunnerDelay;
  const draw = () => slot.innerHTML = `<div class="runner"><div class="wait" aria-live="polite"><span class="count">${t}</span><span class="msg">Partner in…</span></div><div class="rname">???</div><div class="rclub">Leg ${L.leg}</div></div>`;
  draw();
  revealTimer = setInterval(() => {
    t--;
    if (t > 0) { slot.querySelector(".count").textContent = t; return; }
    clearInterval(revealTimer);
    slot.innerHTML = runnerHTML(b, true);
    setTimeout(() => mountPredict(L), 1200);
  }, 1000);
}

function route() {
  const m = location.hash.match(/^#leg([1-4])$/);
  if (m) leg(+m[1]); else home();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
